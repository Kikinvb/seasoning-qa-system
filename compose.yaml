name: seasoning-qa-system
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: food_kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d food_kb"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kb:kb_local@postgres:5432/food_kb
      HF_HOME: /models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models
      - ./data/processed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  models:

